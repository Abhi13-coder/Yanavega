name: Create signing key (run once)
on: workflow_dispatch
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and save it as repo secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore release.keystore -storepass "$PASS" -keypass "$PASS" \
            -alias yanavega -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Yanavega, O=Yanaverse"
          gh secret set KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" --body "$(base64 -w0 release.keystore)"
          gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
          gh secret set KEY_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
          gh secret set KEY_ALIAS --repo "$GITHUB_REPOSITORY" --body "yanavega"
