name: Update manifest
on:
  push:
    branches: [main]
    paths: ['content/**', 'tools/make_manifest.py']
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/make_manifest.py --version "1.0.${{ github.run_number }}"
      - name: Commit manifest
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/manifest.json
          git diff --cached --quiet || (git commit -m "chore: update manifest" && git push)
